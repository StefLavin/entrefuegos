<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Control de Stock</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 20px; background-color: #f9f9f9; }
    .grid-container { display: flex; gap: 20px; flex-wrap: wrap; }
    .categoria-card { flex: 1; min-width: 300px; background: #fff; padding: 15px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
    .categoria-card h2 { border-bottom: 2px solid #eee; padding-bottom: 8px; font-size: 1.2rem; }
    ul { list-style: none; padding: 0; }
    li { display: flex; justify-content: space-between; align-items: center; padding: 8px 0; border-bottom: 1px solid #f0f0f0; }
    .acciones button { padding: 4px 8px; margin-left: 2px; cursor: pointer; border: none; border-radius: 4px; font-weight: bold; }
    .btn-sumar { background-color: #28a745; color: white; }
    .btn-restar { background-color: #ffc107; color: black; }
    .btn-eliminar { background-color: #dc3545; color: white; }
    .form-container { background: #fff; padding: 15px; border-radius: 8px; margin-bottom: 20px; max-width: 500px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
    .form-group { margin-bottom: 10px; display: flex; flex-direction: column; gap: 5px; }
    input, select, button { padding: 8px; font-size: 0.9rem; }
  </style>
</head>
<body>

  <h1>Gestión de Stock</h1>

  <!-- Formulario para agregar nuevos insumos -->
  <div class="form-container">
    <h3>Agregar Nuevo Insumo</h3>
    <div class="form-group">
      <label for="nombreInsumo">Nombre:</label>
      <input type="text" id="nombreInsumo" placeholder="Ej: Harina 000, Vasos 300ml, Agua 500cc">
    </div>
    <div class="form-group">
      <label for="categoriaInsumo">Categoría:</label>
      <select id="categoriaInsumo">
        <option value="materiaPrima">Materia Prima</option>
        <option value="descartable">Descartable</option>
        <option value="bebidas">Bebidas</option>
      </select>
    </div>
    <div class="form-group">
      <label for="cantidadInsumo">Cantidad Inicial:</label>
      <input type="number" id="cantidadInsumo" value="0" min="0">
    </div>
    <button onclick="agregarInsumo()">Guardar Insumo</button>
  </div>

  <!-- Contenedor dividido por categorías -->
  <div class="grid-container">
    
    <div class="categoria-card">
      <h2>🥩 Materia Prima</h2>
      <ul id="lista-materiaPrima"></ul>
    </div>

    <div class="categoria-card">
      <h2>🥤 Descartables</h2>
      <ul id="lista-descartable"></ul>
    </div>

    <div class="categoria-card">
      <h2>🍾 Bebidas</h2>
      <ul id="lista-bebidas"></ul>
    </div>

  </div>

  <script>
    // Estado inicial del inventario
    let inventario = [
      { id: 1, nombre: 'Harina de Trigo (kg)', categoria: 'materiaPrima', cantidad: 25 },
      { id: 2, nombre: 'Vasos Plásticos 330ml', categoria: 'descartable', cantidad: 150 },
      { id: 3, nombre: 'Agua Mineral 500ml', categoria: 'bebidas', cantidad: 48 }
    ];

    function renderizarInventario() {
      // Limpiar listas
      document.getElementById('lista-materiaPrima').innerHTML = '';
      document.getElementById('lista-descartable').innerHTML = '';
      document.getElementById('lista-bebidas').innerHTML = '';

      inventario.forEach(item => {
        const ulTarget = document.getElementById(`lista-${item.categoria}`);
        if (!ulTarget) return;

        const li = document.createElement('li');
        li.innerHTML = `
          <span><strong>${item.nombre}</strong>: ${item.cantidad} unidades</span>
          <div class="acciones">
            <button class="btn-sumar" onclick="modificarCantidad(${item.id}, 1)">+</button>
            <button class="btn-restar" onclick="modificarCantidad(${item.id}, -1)">-</button>
            <button class="btn-eliminar" onclick="eliminarInsumo(${item.id})">×</button>
          </div>
        `;
        ulTarget.appendChild(li);
      });
    }

    // Función para sumar o descontar stock
    function modificarCantidad(id, cambio) {
      const insumo = inventario.find(i => i.id === id);
      if (insumo) {
        if (insumo.cantidad + cambio < 0) {
          alert("El stock no puede ser negativo.");
          return;
        }
        insumo.cantidad += cambio;
        renderizarInventario();
      }
    }

    // Agregar nuevo insumo
    function agregarInsumo() {
      const nombre = document.getElementById('nombreInsumo').value.trim();
      const categoria = document.getElementById('categoriaInsumo').value;
      const cantidad = parseInt(document.getElementById('cantidadInsumo').value, 10);

      if (!nombre || isNaN(cantidad) || cantidad < 0) {
        alert("Por favor ingresa un nombre y cantidad válidos.");
        return;
      }

      const nuevoInsumo = {
        id: Date.now(),
        nombre: nombre,
        categoria: categoria,
        cantidad: cantidad
      };

      inventario.push(nuevoInsumo);
      document.getElementById('nombreInsumo').value = '';
      document.getElementById('cantidadInsumo').value = '0';
      renderizarInventario();
    }

    // Eliminar insumo del registro
    function eliminarInsumo(id) {
      inventario = inventario.filter(i => i.id !== id);
      renderizarInventario();
    }

    // Carga inicial
    renderizarInventario();
  </script>

</body>
</html>
