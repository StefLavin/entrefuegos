<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sistema de Ventas - Empanadas</title>
  <style>
    * {
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }
    body {
      background-color: #f4f6f8;
      margin: 0;
      padding: 20px;
    }
    .container {
      max-width: 650px;
      margin: 0 auto;
      background: #ffffff;
      padding: 25px;
      border-radius: 10px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    }
    h2, h3 {
      color: #333;
      margin-top: 0;
    }
    .form-group {
      margin-bottom: 15px;
    }
    label {
      display: block;
      font-weight: bold;
      margin-bottom: 5px;
      color: #555;
    }
    input[type="date"], select, input[type="number"] {
      width: 100%;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 5px;
      font-size: 16px;
    }
    .sabores-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 15px;
      margin-top: 10px;
    }
    .sabor-item {
      background: #f8f9fa;
      padding: 12px;
      border-radius: 6px;
      border: 1px solid #e9ecef;
    }
    .resumen-box {
      background: #e9ecef;
      padding: 15px;
      border-radius: 6px;
      margin-top: 20px;
    }
    .resumen-box p {
      margin: 5px 0;
      font-size: 16px;
    }
    .precio-total {
      font-size: 22px !important;
      font-weight: bold;
      color: #2b8a3e;
    }
    button {
      width: 100%;
      background-color: #2b8a3e;
      color: white;
      border: none;
      padding: 12px;
      font-size: 18px;
      font-weight: bold;
      border-radius: 6px;
      cursor: pointer;
      margin-top: 15px;
    }
    button:hover {
      background-color: #237032;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 15px;
    }
    th, td {
      border: 1px solid #dee2e6;
      padding: 10px;
      text-align: left;
      font-size: 14px;
    }
    th {
      background-color: #f1f3f5;
    }
  </style>
</head>
<body>

<div class="container">
  <h2>Registrar Venta de Empanadas</h2>

  <div class="form-group">
    <label for="fechaVenta">Fecha de la Venta:</label>
    <input type="date" id="fechaVenta">
  </div>

  <div class="form-group">
    <label for="tipoEmpanada">Tamaño de Empanada:</label>
    <select id="tipoEmpanada" onchange="calcularTotales()">
      <option value="Estandar">Estándar</option>
      <option value="Copetin">Copetín</option>
    </select>
  </div>

  <h3>Cantidad por Sabor:</h3>
  <div class="sabores-grid">
    <div class="sabor-item">
      <label for="cantJYQ">Jamón y Queso</label>
      <input type="number" id="cantJYQ" min="0" value="0" oninput="calcularTotales()">
    </div>
    <div class="sabor-item">
      <label for="cantCarne">Carne</label>
      <input type="number" id="cantCarne" min="0" value="0" oninput="calcularTotales()">
    </div>
    <div class="sabor-item">
      <label for="cantPollo">Pollo</label>
      <input type="number" id="cantPollo" min="0" value="0" oninput="calcularTotales()">
    </div>
  </div>

  <div class="resumen-box">
    <p>Total Empanadas: <strong id="lblTotalUnidades">0</strong> u.</p>
    <p id="lblDesgloseTarifa">Desglose: 0 docenas, 0 medias, 0 sueltas</p>
    <p class="precio-total">Monto Total: $<span id="lblMontoTotal">0</span></p>
  </div>

  <button onclick="guardarVenta()">Confirmar y Registrar Venta</button>

  <h3 style="margin-top: 30px;">Ventas Registradas</h3>
  <table>
    <thead>
      <tr>
        <th>Fecha</th>
        <th>Tipo</th>
        <th>Detalle por Sabor</th>
        <th>Total ($)</th>
      </tr>
    </thead>
    <tbody id="tablaHistorial">
      </tbody>
  </table>
</div>

<script>
  // Constantes de precios para tamaño Estándar
  const PRECIO_DOCENA = 20000;
  const PRECIO_MEDIA = 10000;
  const PRECIO_UNIDAD = 1800;

  // Cargar fecha actual por defecto en el selector
  document.addEventListener("DOMContentLoaded", () => {
    const hoy = new Date().toISOString().split('T')[0];
    document.getElementById("fechaVenta").value = hoy;
  });

  // Función para calcular el precio según la combinación más conveniente
  function calcularPrecioEstandar(totalUnidades) {
    if (totalUnidades <= 0) {
      return { total: 0, docenas: 0, mediasDocenas: 0, unidadesSueltas: 0 };
    }

    let docenas = Math.floor(totalUnidades / 12);
    let remanente = totalUnidades % 12;

    let mediasDocenas = 0;
    let unidadesSueltas = 0;

    if (remanente >= 6) {
      mediasDocenas = 1;
      unidadesSueltas = remanente - 6;
    } else {
      unidadesSueltas = remanente;
    }

    const total = (docenas * PRECIO_DOCENA) + 
                  (mediasDocenas * PRECIO_MEDIA) + 
                  (unidadesSueltas * PRECIO_UNIDAD);

    return { total, docenas, mediasDocenas, unidadesSueltas };
  }

  // Actualizar resumen en tiempo real mientras el usuario ingresa cantidades
  function calcularTotales() {
    const jyq = parseInt(document.getElementById("cantJYQ").value) || 0;
    const carne = parseInt(document.getElementById("cantCarne").value) || 0;
    const pollo = parseInt(document.getElementById("cantPollo").value) || 0;
    const tipo = document.getElementById("tipoEmpanada").value;

    const totalUnidades = jyq + carne + pollo;
    document.getElementById("lblTotalUnidades").innerText = totalUnidades;

    if (tipo === "Estandar") {
      const calculo = calcularPrecioEstandar(totalUnidades);
      document.getElementById("lblMontoTotal").innerText = calculo.total.toLocaleString("es-AR");
      document.getElementById("lblDesgloseTarifa").innerText = 
        `Desglose: ${calculo.docenas} docena(s), ${calculo.mediasDocenas} media(s), ${calculo.unidadesSueltas} unidad(es) suelta(s)`;
    } else {
      // Ajustar aquí si Copetín maneja un precio fijo distinto
      document.getElementById("lblDesgloseTarifa").innerText = "Precio de Copetín sujeto a tarifa especial";
    }
  }

  // Guardar venta y refrescar la tabla del historial
  function guardarVenta() {
    const fecha = document.getElementById("fechaVenta").value;
    const tipo = document.getElementById("tipoEmpanada").value;
    const jyq = parseInt(document.getElementById("cantJYQ").value) || 0;
    const carne = parseInt(document.getElementById("cantCarne").value) || 0;
    const pollo = parseInt(document.getElementById("cantPollo").value) || 0;

    const totalUnidades = jyq + carne + pollo;

    if (totalUnidades === 0) {
      alert("Por favor ingresa al menos una unidad para registrar la venta.");
      return;
    }

    const calculo = calcularPrecioEstandar(totalUnidades);

    // Formatear detalle de sabores
    let detalleSabores = [];
    if (jyq > 0) detalleSabores.push(`${jyq} J&Q`);
    if (carne > 0) detalleSabores.push(`${carne} Carne`);
    if (pollo > 0) detalleSabores.push(`${pollo} Pollo`);

    // Agregar fila a la tabla del historial
    const tabla = document.getElementById("tablaHistorial");
    const nuevaFila = document.createElement("tr");

    nuevaFila.innerHTML = `
      <td>${fecha}</td>
      <td>${tipo}</td>
      <td>${detalleSabores.join(", ")} (${totalUnidades} u.)</td>
      <td>$${calculo.total.toLocaleString("es-AR")}</td>
    `;

    tabla.prepend(nuevaFila);

    // Limpiar formulario despues de guardar
    document.getElementById("cantJYQ").value = 0;
    document.getElementById("cantCarne").value = 0;
    document.getElementById("cantPollo").value = 0;
    calcularTotales();

    alert("¡Venta registrada con éxito!");
  }
</script>

</body>
</html>
