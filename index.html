<!-- LÓGICA Y FIREBASE -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { 
      getFirestore, 
      collection, 
      addDoc, 
      serverTimestamp,
      onSnapshot 
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBLkWuMHj3hEXQ7b6Fr0I5Eu8B4I8KqlGk",
      authDomain: "entrefuegos-c5b78.firebaseapp.com",
      projectId: "entrefuegos-c5b78",
      storageBucket: "entrefuegos-c5b78.firebasestorage.app",
      messagingSenderId: "170507928754",
      appId: "1:170507928754:web:e14fd77c535494afe975ab",
      measurementId: "G-JRP0T5W9SJ"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    let catalogo = JSON.parse(localStorage.getItem('catalogo_entrefuegos')) || [];
    let materiasPrimas = JSON.parse(localStorage.getItem('materias_primas_entrefuegos')) || [];
    let recetasCostos = JSON.parse(localStorage.getItem('recetas_costos_entrefuegos')) || [];
    let carrito = [];
    let medioPagoSeleccionado = 'Efectivo';

    // ESCUCHA EN TIEMPO REAL CON FIRESTORE
    function iniciarSincronizacionEnTiempoReal() {
      // Escuchar cambios en el menú de productos
      onSnapshot(collection(db, "productos"), (snapshot) => {
        if (!snapshot.empty) {
          catalogo = [];
          snapshot.forEach(doc => {
            catalogo.push({ id: doc.id, ...doc.data() });
          });
          localStorage.setItem('catalogo_entrefuegos', JSON.stringify(catalogo));
          renderizarTodo();
        }
      });

      // Escuchar cambios en insumos
      onSnapshot(collection(db, "insumos"), (snapshot) => {
        if (!snapshot.empty) {
          materiasPrimas = [];
          snapshot.forEach(doc => {
            materiasPrimas.push({ id: doc.id, ...doc.data() });
          });
          localStorage.setItem('materias_primas_entrefuegos', JSON.stringify(materiasPrimas));
          renderizarTodo();
        }
      });
    }

    window.cambiarPestana = function(pestana) {
      const vPos = document.getElementById('vista-pos');
      const vAdmin = document.getElementById('vista-admin');
      const vIngredientes = document.getElementById('vista-ingredientes');
      const vCostos = document.getElementById('vista-costos');

      const tPos = document.getElementById('tab-pos');
      const tAdmin = document.getElementById('tab-admin');
      const tIng = document.getElementById('tab-ingredientes');
      const tCostos = document.getElementById('tab-costos');

      [vPos, vAdmin, vIngredientes, vCostos].forEach(el => el.classList.add('hidden'));

      const inactiveStyle = "py-2.5 px-4 font-bold text-sm border-b-4 border-transparent text-amber-200 hover:text-white flex items-center gap-2 whitespace-nowrap";
      const activeStyle = "py-2.5 px-4 font-bold text-sm border-b-4 border-white text-white flex items-center gap-2 whitespace-nowrap";

      [tPos, tAdmin, tIng, tCostos].forEach(el => el.className = inactiveStyle);

      if (pestana === 'pos') { vPos.classList.remove('hidden'); tPos.className = activeStyle; }
      else if (pestana === 'admin') { vAdmin.classList.remove('hidden'); tAdmin.className = activeStyle; }
      else if (pestana === 'ingredientes') { vIngredientes.classList.remove('hidden'); tIng.className = activeStyle; }
      else if (pestana === 'costos') { vCostos.classList.remove('hidden'); tCostos.className = activeStyle; }
    };

    window.guardarIngrediente = async function(e) {
      e.preventDefault();
      const nombre = document.getElementById('ing-nombre').value;
      const cantPaquete = parseFloat(document.getElementById('ing-cantidad-paquete').value);
      const unidad = document.getElementById('ing-unidad').value;
      const precioPaquete = parseFloat(document.getElementById('ing-precio-paquete').value);

      let factorConversion = 1;
      if (unidad === 'kg' || unidad === 'lt') factorConversion = cantPaquete * 1000;
      else factorConversion = cantPaquete;

      const costoUnitarioStandard = precioPaquete / factorConversion;

      const nuevoInsumo = {
        nombre,
        cantidadPaquete: cantPaquete,
        unidad,
        precioPaquete,
        costoUnitarioStandard,
        fecha: serverTimestamp()
      };

      try {
        await addDoc(collection(db, "insumos"), nuevoInsumo);
        e.target.reset();
        alert('¡Insumo sincronizado con éxito!');
      } catch (err) {
        console.error("Error al guardar insumo:", err);
      }
    };

    window.guardarNuevoProducto = async function(e) {
      e.preventDefault();
      const categoria = document.getElementById('prod-categoria').value;
      const nombre = document.getElementById('prod-nombre').value;
      const precio = parseFloat(document.getElementById('prod-precio').value);
      const litros = document.getElementById('prod-litros').value;

      let nombreFinal = nombre;
      if (categoria === 'Bebidas' && litros) nombreFinal = `${nombre} (${litros})`;

      const nuevo = { categoria, nombre: nombreFinal, precio, fecha: serverTimestamp() };
      if (categoria === 'Empanadas') nuevo.docena = precio * 10;

      try {
        await addDoc(collection(db, "productos"), nuevo);
        alert('¡Producto guardado y sincronizado!');
        e.target.reset();
        cambiarPestana('pos');
      } catch (err) {
        console.error("Error al guardar producto:", err);
      }
    };

    function renderizarTodo() {
      renderizarPOS();
      renderizarAdmin();
      renderizarMateriasPrimas();
      renderizarSelectoresInsumos();
      renderizarRecetas();
    }

    function renderizarPOS() {
      const empanadasContainer = document.getElementById('grid-empanadas');
      const pizzasViandasContainer = document.getElementById('grid-pizzas-viandas');
      const bebidasContainer = document.getElementById('grid-bebidas');

      if(!empanadasContainer) return;

      empanadasContainer.innerHTML = '';
      pizzasViandasContainer.innerHTML = '';
      bebidasContainer.innerHTML = '';

      catalogo.forEach(prod => {
        if (prod.categoria === 'Empanadas') {
          empanadasContainer.innerHTML += `
            <div class="border rounded-lg p-3 text-center bg-slate-50 border-slate-200">
              <span class="font-bold block text-slate-800">${prod.nombre}</span>
              <span class="text-xs text-slate-500">$${prod.precio.toLocaleString()} u. | $${(prod.docena || prod.precio * 10).toLocaleString()} doc.</span>
              <div class="mt-3 flex justify-center gap-2">
                <button onclick="agregarItem('${prod.nombre} (Unid)', ${prod.precio})" class="bg-amber-600 hover:bg-amber-700 text-white text-xs px-2.5 py-1.5 rounded-lg font-bold">+1 Unid</button>
                <button onclick="agregarItem('Docena ${prod.nombre}', ${prod.docena || prod.precio * 10})" class="bg-slate-800 hover:bg-slate-900 text-white text-xs px-2.5 py-1.5 rounded-lg font-bold">+1 Doc</button>
              </div>
            </div>
          `;
        } else if (prod.categoria === 'Pizza' || prod.categoria === 'Vianda') {
          pizzasViandasContainer.innerHTML += `
            <div class="border p-3 rounded-lg bg-slate-50 border-slate-200 flex justify-between items-center">
              <div>
                <span class="font-bold block">${prod.nombre}</span>
                <span class="text-xs text-slate-500">$${prod.precio.toLocaleString()}</span>
              </div>
              <button onclick="agregarItem('${prod.nombre}', ${prod.precio})" class="bg-amber-600 hover:bg-amber-700 text-white px-3 py-1.5 rounded-lg font-bold text-xs">+ Agregar</button>
            </div>
          `;
        } else if (prod.categoria === 'Bebidas') {
          bebidasContainer.innerHTML += `
            <div class="border p-3 rounded-lg bg-slate-50 border-slate-200 text-center">
              <span class="font-bold block text-sm">${prod.nombre}</span>
              <span class="text-xs text-slate-500 block mb-2">$${prod.precio.toLocaleString()}</span>
              <button onclick="agregarItem('${prod.nombre}', ${prod.precio})" class="bg-amber-600 hover:bg-amber-700 text-white px-3 py-1.5 rounded-lg font-bold text-xs w-full">+ Agregar</button>
            </div>
          `;
        }
      });
    }

    function renderizarAdmin() {
      const container = document.getElementById('lista-admin-productos');
      if(!container) return;
      container.innerHTML = '';

      catalogo.forEach(p => {
        container.innerHTML += `
          <div class="py-3 flex justify-between items-center">
            <div>
              <span class="text-xs bg-slate-200 text-slate-700 px-2 py-0.5 rounded font-bold mr-2">${p.categoria}</span>
              <span class="font-bold text-slate-800 text-sm">${p.nombre}</span>
            </div>
            <span class="text-sm font-semibold text-slate-600">$${p.precio.toLocaleString()}</span>
          </div>
        `;
      });
    }

    function renderizarMateriasPrimas() {
      const container = document.getElementById('lista-ingredientes-base');
      if(!container) return;
      container.innerHTML = '';

      materiasPrimas.forEach(m => {
        let textoMedidaBase = m.unidad === 'kg' ? 'gramo' : (m.unidad === 'lt' ? 'ml' : 'unid');
        container.innerHTML += `
          <div class="py-3 flex justify-between items-center">
            <div>
              <span class="font-bold text-slate-800 text-sm block">${m.nombre}</span>
              <span class="text-xs text-slate-500">Compra: ${m.cantidadPaquete} ${m.unidad} x $${m.precioPaquete.toLocaleString()}</span>
            </div>
            <span class="text-xs bg-amber-50 text-amber-800 px-2.5 py-1 rounded-lg border border-amber-200 font-bold">
              $${m.costoUnitarioStandard.toFixed(2)} / ${textoMedidaBase}
            </span>
          </div>
        `;
      });
    }

    window.agregarFilaIngredienteReceta = function() {
      const contenedor = document.getElementById('contenedor-ingredientes-receta');
      if(!contenedor) return;
      const div = document.createElement('div');
      div.className = "grid grid-cols-12 gap-2 items-center fila-insumo-receta";

      let optionsHTML = materiasPrimas.map(m => {
        let unidDisplay = (m.unidad === 'kg') ? 'gr' : (m.unidad === 'lt' ? 'ml' : m.unidad);
        return `<option value="${m.id}">${m.nombre} (Costo base: $${m.costoUnitarioStandard.toFixed(2)}/${unidDisplay})</option>`;
      }).join('');

      div.innerHTML = `
        <select class="col-span-6 border p-2 rounded-lg text-sm bg-slate-50 insumo-select" required>
          <option value="">-- Seleccionar Insumo --</option>
          ${optionsHTML}
        </select>
        <input type="number" step="0.01" placeholder="Cant. usada (gr/ml/u)" class="col-span-5 border p-2 rounded-lg text-sm bg-slate-50 insumo-cantidad" required>
        <button type="button" onclick="this.parentElement.remove()" class="col-span-1 text-red-500 hover:text-red-700 text-center"><i class="fa-solid fa-trash"></i></button>
      `;
      contenedor.appendChild(div);
    };

    function renderizarSelectoresInsumos() {
      const contenedor = document.getElementById('contenedor-ingredientes-receta');
      if(!contenedor) return;
      contenedor.innerHTML = '';
      agregarFilaIngredienteReceta();
    }

    function renderizarRecetas() {
      const container = document.getElementById('lista-recetas-costos');
      if(!container) return;
      container.innerHTML = '';

      recetasCostos.forEach(r => {
        container.innerHTML += `
          <div class="border rounded-xl p-4 bg-slate-50 border-slate-200 flex flex-col justify-between space-y-3 relative shadow-sm">
            <div>
              <h3 class="font-bold text-slate-800 text-base pr-6">${r.nombre}</h3>
              <div class="grid grid-cols-2 gap-2 mt-2 bg-white p-2.5 rounded-lg border border-slate-100 text-xs">
                <div><span class="text-slate-500 block">Rendimiento:</span> <strong>${r.rendimiento} unidades</strong></div>
                <div><span class="text-slate-500 block">Costo Unitario:</span> <strong class="text-amber-600 text-sm">$${Math.round(r.costoUnitario).toLocaleString()} c/u</strong></div>
              </div>
            </div>
          </div>
        `;
      });
    }

    window.agregarItem = function(nombre, precio) {
      const existe = carrito.find(item => item.nombre === nombre);
      if (existe) existe.cantidad += 1;
      else carrito.push({ nombre, precio, cantidad: 1 });
      renderizarPedido();
    };

    window.cambiarCantidad = function(nombre, cambio) {
      const item = carrito.find(i => i.nombre === nombre);
      if (item) {
        item.cantidad += cambio;
        if (item.cantidad <= 0) carrito = carrito.filter(i => i.nombre !== nombre);
      }
      renderizarPedido();
    };

    window.vaciarCarrito = function() {
      carrito = [];
      renderizarPedido();
    };

    window.seleccionarPago = function(metodo) {
      medioPagoSeleccionado = metodo;
      document.querySelectorAll('.btn-pago').forEach(btn => {
        btn.classList.remove('bg-amber-600', 'text-white', 'border-amber-600');
        btn.classList.add('border-slate-300', 'text-slate-600');
      });
      const btnActivo = document.getElementById(`btn-${metodo}`);
      if (btnActivo) {
        btnActivo.classList.add('bg-amber-600', 'text-white', 'border-amber-600');
        btnActivo.classList.remove('border-slate-300', 'text-slate-600');
      }
    };

    function renderizarPedido() {
      const contenedor = document.getElementById('lista-pedido');
      const totalElemento = document.getElementById('total-monto');

      if (carrito.length === 0) {
        contenedor.innerHTML = `<p class="text-sm text-slate-400 text-center py-8">No hay productos en el pedido.</p>`;
        totalElemento.innerText = `$0`;
        return;
      }

      let html = '';
      let total = 0;

      carrito.forEach(item => {
        const subtotal = item.precio * item.cantidad;
        total += subtotal;
        html += `
          <div class="flex justify-between items-center bg-slate-50 p-2 rounded-lg border border-slate-100">
            <div>
              <span class="text-sm font-bold block text-slate-700">${item.nombre}</span>
              <span class="text-xs text-slate-500">$${item.precio.toLocaleString()} c/u</span>
            </div>
            <div class="flex items-center gap-2">
              <button onclick="cambiarCantidad('${item.nombre}', -1)" class="w-6 h-6 bg-slate-200 text-slate-700 rounded-full font-bold flex items-center justify-center text-xs">-</button>
              <span class="text-sm font-bold w-4 text-center">${item.cantidad}</span>
              <button onclick="cambiarCantidad('${item.nombre}', 1)" class="w-6 h-6 bg-slate-200 text-slate-700 rounded-full font-bold flex items-center justify-center text-xs">+</button>
              <span class="text-sm font-bold text-slate-800 ml-2">$${subtotal.toLocaleString()}</span>
            </div>
          </div>
        `;
      });

      contenedor.innerHTML = html;
      totalElemento.innerText = `$${total.toLocaleString()}`;
    }

    window.registrarVenta = async function() {
      if (carrito.length === 0) {
        alert('Por favor agrega al menos un producto al pedido.');
        return;
      }

      const btn = document.getElementById('btn-guardar');
      btn.disabled = true;
      btn.innerText = 'Guardando...';

      const totalCalculado = carrito.reduce((sum, item) => sum + (item.precio * item.cantidad), 0);

      try {
        await addDoc(collection(db, "ventas"), {
          items: carrito,
          total: totalCalculado,
          medioPago: medioPagoSeleccionado,
          fecha: serverTimestamp()
        });

        alert('¡Venta guardada y sincronizada al instante!');
        vaciarCarrito();
      } catch (error) {
        console.error("Error al guardar venta: ", error);
        alert('Ocurrió un error al guardar la venta.');
      } finally {
        btn.disabled = false;
        btn.innerHTML = `<i class="fa-solid fa-cloud-arrow-up"></i> Registrar y Sincronizar`;
      }
    };

    // Inicializaciones
    window.seleccionarPago('Efectivo');
    iniciarSincronizacionEnTiempoReal();
    renderizarTodo();
  </script>
